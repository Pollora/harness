# Pollora harness — Semgrep rules.
#
# Run from the repository root:
#     semgrep scan --config vendor/pollora/harness/presets/semgrep --error
#
# A deliberate exception is written on the line it concerns, with the reason:
#     // nosemgrep -- the closure is signed with an HMAC before it is stored
# Each exception is visible in review; none is silent. (Semgrep prefixes the
# rule ids with the config path, so the comment names no id.)

rules:
  - id: pollora.sec-03.wpdb-unprepared-query
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-03] $METHOD() receives SQL that does not come from $DB->prepare().
      Build the query with $DB->prepare() and placeholders (%s, %d, %i), or use
      a Colt query.
    metadata:
      rule: SEC-03
      cwe: "CWE-89: SQL Injection"
    patterns:
      - pattern: $DB->$METHOD($SQL, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|get_results|get_row|get_var|get_col)$
      - metavariable-regex:
          metavariable: $DB
          regex: (?i)^\$?(this->)?wpdb$
      - pattern-not: $DB->$METHOD($DB->prepare(...), ...)
      # A literal with nothing interpolated cannot carry input.
      - metavariable-regex:
          metavariable: $SQL
          regex: ^(?!'[^']*'$)(?!"[^"$]*"$)
      - pattern-not-inside: |
          $SQL = $DB->prepare(...);
          ...

  - id: pollora.sec-04.blade-raw-output
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.blade.php"
    message: >-
      [SEC-04] {!! !!} prints without escaping. Use {{ }}; when the HTML is
      trusted (it went through wp_kses_post() or comes from a block render), keep
      {!! !!} with a `nosemgrep` comment that says why. Not reported: an output
      that starts with an escaping function (esc_*, wp_kses*, absint…), a
      component `$slot`, or a WordPress or WooCommerce function that returns
      HTML it has escaped itself. Only the first call is looked at:
      `{!! esc_html($a) . $b !!}` passes, so keep the whole expression escaped.
    metadata:
      rule: SEC-04
      cwe: "CWE-79: Cross-site Scripting"
    # PCRE: the lookaheads skip the outputs that are safe by construction.
    pattern-regex: >-
      \{!!(?!\s*\$slot\s*!!\})(?!\s*\\?(?:esc_(?:attr|html)(?:__|_[ex])?|esc_url|esc_js|esc_textarea|wp_kses(?:_post|_data)?|absint|wc_kses_notice|wp_strip_all_tags|post_class|comment_class|body_class|wc_product_class|get_language_attributes|get_search_form|get_custom_logo|get_avatar|get_the_post_thumbnail|wp_get_attachment_image|wp_nav_menu|wp_list_comments|wp_link_pages|paginate_links|get_the_comments_navigation|get_previous_posts_link|get_next_posts_link|get_block_wrapper_attributes|get_the_archive_title|get_the_archive_description|category_description|single_cat_title|comment_text|wc_price|wc_get_rating_html|wc_get_stock_html|wc_get_template|woocommerce_page_title|wc_get_notice_data_attr|wc_get_product_category_list|wc_get_product_tag_list|wc_query_string_form_fields|wc_get_formatted_cart_item_data|wc_cart_totals_taxes_total_html|wc_cart_totals_shipping_html|wc_cart_totals_order_total_html|wc_cart_totals_shipping_method_label|woocommerce_shipping_calculator|woocommerce_form_field)\s*\()

  - id: pollora.sec-05.unsafe-functions
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-05] unserialize(), maybe_unserialize(), eval() and extract() run or
      inject whatever the input holds. Use json_decode() and explicit
      assignments.
    metadata:
      rule: SEC-05
      cwe: "CWE-502: Deserialization of Untrusted Data"
    pattern-either:
      - pattern: unserialize(...)
      - pattern: maybe_unserialize(...)
      - pattern: eval(...)
      - pattern: extract(...)

  - id: pollora.sec-01.rest-route-without-permission
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.php"
    message: >-
      [SEC-01] This route declares no permission, and pollora/wp-rest then
      registers it with __return_true: anyone can call it. Pass a Permission
      (Pollora\WpRest\Permissions\IsLoggedIn, IsAdmin, Can) on the class or on
      each method. A route that must stay public says so with a `nosemgrep`
      comment and the reason.
    metadata:
      rule: SEC-01
      cwe: "CWE-862: Missing Authorization"
    pattern-regex: '#\[\s*(?:\\?Pollora\\Attributes\\)?WpRestRoute\s*\((?![^)]*permission)[^)]*\)\s*\]'

  - id: pollora.conv-10.bare-exception
    languages: [php]
    severity: ERROR
    message: >-
      [CONV-10] Throw a named exception for this case (for example
      ModuleLockedException::for($module)) with a message that says how to fix
      it, not a bare \Exception.
    metadata:
      rule: CONV-10
    pattern-either:
      - pattern: throw new \Exception(...);
      - pattern: throw new Exception(...);
      - pattern: throw new \RuntimeException(...);
      - pattern: throw new RuntimeException(...);
