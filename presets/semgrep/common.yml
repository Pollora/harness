# Pollora harness — Semgrep rules.
#
# Run from the repository root:
#     semgrep scan --config vendor/pollora/harness/presets/semgrep --error
#
# A deliberate exception is written on the line it concerns, with the reason:
#     // nosemgrep -- the closure is signed with an HMAC before it is stored
# Each exception is visible in review; none is silent. (Semgrep prefixes the
# rule ids with the config path, so the comment names no id.)

rules:
  - id: pollora.sec-03.wpdb-unprepared-query
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-03] $METHOD() receives SQL that does not come from $DB->prepare().
      Build the query with $DB->prepare() and placeholders (%s, %d, %i), or use
      a Colt query.
    metadata:
      rule: SEC-03
      cwe: "CWE-89: SQL Injection"
    patterns:
      - pattern: $DB->$METHOD($SQL, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|get_results|get_row|get_var|get_col)$
      - metavariable-regex:
          metavariable: $DB
          regex: (?i)^\$?(this->)?wpdb$
      - pattern-not: $DB->$METHOD($DB->prepare(...), ...)
      # A literal with nothing interpolated cannot carry input.
      - metavariable-regex:
          metavariable: $SQL
          regex: ^(?!'[^']*'$)(?!"[^"$]*"$)
      - pattern-not-inside: |
          $SQL = $DB->prepare(...);
          ...

  - id: pollora.sec-04.blade-raw-output
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.blade.php"
    message: >-
      [SEC-04] {!! !!} prints without escaping. Use {{ }}; when the HTML is
      trusted (it went through wp_kses_post() or comes from a block render), keep
      {!! !!} with a `nosemgrep` comment that says why. Not reported: an output
      that starts with an escaping function (esc_*, wp_kses*, absint…), a
      component `$slot`, or a WordPress or WooCommerce function that returns
      HTML it has escaped itself. Only the first call is looked at:
      `{!! esc_html($a) . $b !!}` passes, so keep the whole expression escaped.
    metadata:
      rule: SEC-04
      cwe: "CWE-79: Cross-site Scripting"
    # PCRE: the lookaheads skip the outputs that are safe by construction.
    pattern-regex: >-
      \{!!(?!\s*\$slot\s*!!\})(?!\s*\\?(?:esc_(?:attr|html)(?:__|_[ex])?|esc_url|esc_js|esc_textarea|wp_kses(?:_post|_data)?|absint|wc_kses_notice|wp_strip_all_tags|post_class|comment_class|body_class|wc_product_class|get_language_attributes|get_search_form|get_custom_logo|get_avatar|get_the_post_thumbnail|wp_get_attachment_image|wp_nav_menu|wp_list_comments|wp_link_pages|paginate_links|get_the_comments_navigation|get_previous_posts_link|get_next_posts_link|get_block_wrapper_attributes|get_the_archive_title|get_the_archive_description|category_description|single_cat_title|comment_text|wc_price|wc_get_rating_html|wc_get_stock_html|wc_get_template|woocommerce_page_title|wc_get_notice_data_attr|wc_get_product_category_list|wc_get_product_tag_list|wc_query_string_form_fields|wc_get_formatted_cart_item_data|wc_cart_totals_taxes_total_html|wc_cart_totals_shipping_html|wc_cart_totals_order_total_html|wc_cart_totals_shipping_method_label|woocommerce_shipping_calculator|woocommerce_form_field)\s*\()

  - id: pollora.sec-05.unsafe-functions
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-05] unserialize(), maybe_unserialize(), eval() and extract() run or
      inject whatever the input holds. Use json_decode() and explicit
      assignments.
    metadata:
      rule: SEC-05
      cwe: "CWE-502: Deserialization of Untrusted Data"
    pattern-either:
      - pattern: unserialize(...)
      - pattern: maybe_unserialize(...)
      - pattern: eval(...)
      - pattern: extract(...)

  - id: pollora.sec-01.rest-route-without-permission
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*.php"
    message: >-
      [SEC-01] This route declares no permission, and pollora/wp-rest then
      registers it with __return_true: anyone can call it. Pass a Permission
      (Pollora\WpRest\Permissions\IsLoggedIn, IsAdmin, Can) on the class or on
      each method. A route that must stay public says so with a `nosemgrep`
      comment and the reason.
    metadata:
      rule: SEC-01
      cwe: "CWE-862: Missing Authorization"
    pattern-regex: '#\[\s*(?:\\?Pollora\\Attributes\\)?WpRestRoute\s*\((?![^)]*permission)[^)]*\)\s*\]'

  - id: pollora.conv-10.bare-exception
    languages: [php]
    severity: ERROR
    message: >-
      [CONV-10] Throw a named exception for this case (for example
      ModuleLockedException::for($module)) with a message that says how to fix
      it, not a bare \Exception.
    metadata:
      rule: CONV-10
    pattern-either:
      - pattern: throw new \Exception(...);
      - pattern: throw new Exception(...);
      - pattern: throw new \RuntimeException(...);
      - pattern: throw new RuntimeException(...);

  # SEC-02: an AJAX action goes through pollora/ajax, which checks the nonce.
  - id: pollora.sec-02.manual-ajax-hook
    languages: [php]
    severity: ERROR
    paths:
      exclude:
        # The one place that translates an #[Ajax] declaration into hooks.
        - "**/Adapter/Out/WordPress/WordPressAjaxActionRegistrar.php"
    message: >-
      [SEC-02] A hand-registered wp_ajax_* / wp_ajax_nopriv_* hook skips the
      nonce check that pollora/ajax performs. Declare the action with
      #[Ajax('name')] (or Ajax::listen('name')->requireNonce()) and, for a
      guest endpoint, say so with `nonce: false` / `->withoutNonce()` or
      `Ajax::listen('name')->guest()`. A hook that cannot go through pollora/ajax
      keeps a `nosemgrep` comment that names the nonce it verifies.
    metadata:
      rule: SEC-02
      cwe: "CWE-352: Cross-Site Request Forgery"
    patterns:
      - pattern-either:
          - pattern: add_action($HOOK, ...)
          - pattern: $ACTION::add($HOOK, ...)
          - pattern: $ACTION->add($HOOK, ...)
      # Matches 'wp_ajax_x', "wp_ajax_{$x}", 'wp_ajax_' . $x and nopriv variants.
      - metavariable-regex:
          metavariable: $HOOK
          regex: ^["']wp_ajax_

  # SEC-07: an administration entry point checks a capability. A nonce proves
  # where a request came from, never that the user may act.
  - id: pollora.sec-07.admin-handler-without-capability
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-07] This admin_post_* / wp_ajax_* handler never calls
      current_user_can() or user_can(). A nonce proves the origin of the
      request, not the right to act: check the capability the action needs
      (current_user_can('manage_options'), or a narrower one) before doing
      anything, and answer 403 otherwise. A handler whose capability is checked
      elsewhere (a middleware, a method it calls) keeps a `nosemgrep` comment
      that says where.
    metadata:
      rule: SEC-07
      cwe: "CWE-862: Missing Authorization"
    patterns:
      - pattern-either:
          - pattern: add_action($HOOK, $CB, ...)
          - pattern: $ACTION::add($HOOK, $CB, ...)
          - pattern: $ACTION->add($HOOK, $CB, ...)
      - metavariable-regex:
          metavariable: $HOOK
          regex: ^["'](admin_post_|wp_ajax_)
      # A closure or arrow function only: the body of a named callback cannot
      # be read from the call site.
      - metavariable-regex:
          metavariable: $CB
          regex: ^(static\s+)?(function|fn)\b
      - metavariable-regex:
          metavariable: $CB
          regex: '(?s)\A(?!.*\b(current_user_can|user_can|current_user_can_for_blog)\s*\()'

  - id: pollora.sec-07.menu-page-without-capability
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-07] This administration page is registered with an empty or `read`
      capability, so every logged-in user reaches it. Give the capability the
      page needs (`manage_options`, `edit_posts`, a custom one).
    metadata:
      rule: SEC-07
      cwe: "CWE-862: Missing Authorization"
    patterns:
      - pattern-either:
          - pattern: $FN($TITLE, $MENU, "", ...)
          - pattern: $FN($TITLE, $MENU, "read", ...)
          - pattern: $FN($PARENT, $TITLE, $MENU, "", ...)
          - pattern: $FN($PARENT, $TITLE, $MENU, "read", ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^\\?(add_menu_page|add_submenu_page|add_options_page|add_management_page|add_theme_page|add_plugins_page|add_users_page|add_dashboard_page|add_posts_page|add_media_page|add_pages_page|add_comments_page|add_utility_page)$

  # SEC-06: what a request sends is validated strictly, and a secret is
  # compared in constant time.
  - id: pollora.sec-06.unanchored-end-of-line
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-06] This pattern ends with `$` and has neither the `D` modifier nor
      `\z`, so it also accepts a value followed by a newline: `/^[a-z]+$/`
      matches "evil\n", which a path, a file name or a size taken from a
      request can then smuggle past the check (a real incident in
      pollora/media). End the pattern with `\z`, or add the `D` modifier.
    paths:
      exclude:
        # Console input is typed by the developer, not sent by a request.
        - "**/Console/**"
        - "**/Commands/**"
    metadata:
      rule: SEC-06
      cwe: "CWE-20: Improper Input Validation"
    patterns:
      - pattern-either:
          - pattern: preg_match($PATTERN, $INPUT, ...)
          - pattern: preg_match($PATTERN, $INPUT)
      # A literal that ends with an unescaped `$` and a delimiter, flags without D or m (with m, `$` ends a line on purpose: a
      # multi-line parser).
      # metavariable-regex is anchored at the start of the text: hence `.*`.
      - metavariable-regex:
          metavariable: $PATTERN
          regex: ^["'](?P<d>[/#~@%!|])(?!.*\\z).*[^\\]\$(?P=d)[a-ln-zA-CE-Z]*["']$
      # A value that comes from the request, or is named like one.
      - metavariable-regex:
          metavariable: $INPUT
          regex: (?is).*(\$_(GET|POST|REQUEST|SERVER|COOKIE)\b|path|file|name|slug|uri|url|size|segment|request|param|query|filename|basename)

  - id: pollora.sec-06.secret-compared-without-hash-equals
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-06] A signature, HMAC, token or secret is compared with an
      equality operator, which stops at the first different byte and leaks,
      through its timing, how much of the value a guess got right. Use
      hash_equals($known, $given), with the known value first.
    metadata:
      rule: SEC-06
      cwe: "CWE-208: Observable Timing Discrepancy"
    patterns:
      - pattern-either:
          - pattern: $S === $O
          - pattern: $S == $O
          - pattern: $S !== $O
          - pattern: $S != $O
          - pattern: $O === $S
          - pattern: $O == $S
          - pattern: $O !== $S
          - pattern: $O != $S
      # metavariable-regex is anchored at the start of the text: hence `.*`.
      # A bare `key` is left out: it names array and meta keys far more often
      # than secrets. A call that only measures the value does not compare it.
      - metavariable-regex:
          metavariable: $S
          regex: '(?is)\A(?!\s*(strlen|mb_strlen|count|sizeof|is_\w+|isset|empty)\s*\().*(signature|hmac|token|secret|api_?key|apikey|private_?key|secret_?key|license_?key)'
      # Comparing with a literal, null, a number or a constant (`Cls::NAME`, or a bare
      # one such as the `T_STRING` of the tokenizer) is a presence or type check, not a
      # secret check.
      - metavariable-regex:
          metavariable: $O
          regex: '(?is)\A(?!(null|true|false|\[\s*\]|-?\d+(\.\d+)?|"[^"]*"|''[^'']*''|[A-Za-z_\\]+::[A-Z_]+|\\?[A-Z][A-Z0-9_]*)\z)'
      # The key of a foreach is a name from an array, not a secret: `$key === $signature`
      # in `foreach ($entries as $signature => $entry)` is a lookup. $S is shared with
      # the patterns above, so only a variable that is that very key is left out.
      - pattern-not-inside: |
          foreach ($COLL as $S => $V) {
            ...
          }
