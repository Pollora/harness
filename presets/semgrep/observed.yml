# Pollora harness — Semgrep rules that are reported but do not block yet.
#
# SEC-02 is `observed`: the measure over the ecosystem found hand-registered
# wp_ajax_* hooks, so the rule runs as its own gate ("Security patterns
# (observed)") until they go through pollora/ajax. A deliberate exception is a
# `nosemgrep` comment with the reason, as in common.yml.

rules:
  - id: pollora.sec-02.manual-ajax-hook
    languages: [php]
    severity: ERROR
    paths:
      exclude:
        # The one place that translates an #[Ajax] declaration into hooks.
        - "**/Adapter/Out/WordPress/WordPressAjaxActionRegistrar.php"
    message: >-
      [SEC-02] A hand-registered wp_ajax_* / wp_ajax_nopriv_* hook skips the
      nonce check that pollora/ajax performs. Declare the action with
      #[Ajax('name')] (or Ajax::listen('name')->requireNonce()) and, for a
      guest endpoint, say so with `nonce: false` / `->withoutNonce()` or
      `Ajax::listen('name')->guest()`. A hook that cannot go through pollora/ajax
      keeps a `nosemgrep` comment that names the nonce it verifies.
    metadata:
      rule: SEC-02
      cwe: "CWE-352: Cross-Site Request Forgery"
    patterns:
      - pattern-either:
          - pattern: add_action($HOOK, ...)
          - pattern: $ACTION::add($HOOK, ...)
          - pattern: $ACTION->add($HOOK, ...)
      # Matches 'wp_ajax_x', "wp_ajax_{$x}", 'wp_ajax_' . $x and nopriv variants.
      - metavariable-regex:
          metavariable: $HOOK
          regex: ^["']wp_ajax_

  # SEC-07: an administration entry point checks a capability. A nonce proves
  # where a request came from, never that the user may act.
  - id: pollora.sec-07.admin-handler-without-capability
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-07] This admin_post_* / wp_ajax_* handler never calls
      current_user_can() or user_can(). A nonce proves the origin of the
      request, not the right to act: check the capability the action needs
      (current_user_can('manage_options'), or a narrower one) before doing
      anything, and answer 403 otherwise. A handler whose capability is checked
      elsewhere (a middleware, a method it calls) keeps a `nosemgrep` comment
      that says where.
    metadata:
      rule: SEC-07
      cwe: "CWE-862: Missing Authorization"
    patterns:
      - pattern-either:
          - pattern: add_action($HOOK, $CB, ...)
          - pattern: $ACTION::add($HOOK, $CB, ...)
          - pattern: $ACTION->add($HOOK, $CB, ...)
      - metavariable-regex:
          metavariable: $HOOK
          regex: ^["'](admin_post_|wp_ajax_)
      # A closure or arrow function only: the body of a named callback cannot
      # be read from the call site.
      - metavariable-regex:
          metavariable: $CB
          regex: ^(static\s+)?(function|fn)\b
      - metavariable-regex:
          metavariable: $CB
          regex: '(?s)\A(?!.*\b(current_user_can|user_can|current_user_can_for_blog)\s*\()'

  - id: pollora.sec-07.menu-page-without-capability
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-07] This administration page is registered with an empty or `read`
      capability, so every logged-in user reaches it. Give the capability the
      page needs (`manage_options`, `edit_posts`, a custom one).
    metadata:
      rule: SEC-07
      cwe: "CWE-862: Missing Authorization"
    patterns:
      - pattern-either:
          - pattern: $FN($TITLE, $MENU, "", ...)
          - pattern: $FN($TITLE, $MENU, "read", ...)
          - pattern: $FN($PARENT, $TITLE, $MENU, "", ...)
          - pattern: $FN($PARENT, $TITLE, $MENU, "read", ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^\\?(add_menu_page|add_submenu_page|add_options_page|add_management_page|add_theme_page|add_plugins_page|add_users_page|add_dashboard_page|add_posts_page|add_media_page|add_pages_page|add_comments_page|add_utility_page)$

  # SEC-06: what a request sends is validated strictly, and a secret is
  # compared in constant time.
  - id: pollora.sec-06.unanchored-end-of-line
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-06] This pattern ends with `$` and has neither the `D` modifier nor
      `\z`, so it also accepts a value followed by a newline: `/^[a-z]+$/`
      matches "evil\n", which a path, a file name or a size taken from a
      request can then smuggle past the check (a real incident in
      pollora/media). End the pattern with `\z`, or add the `D` modifier.
    paths:
      exclude:
        # Console input is typed by the developer, not sent by a request.
        - "**/Console/**"
        - "**/Commands/**"
    metadata:
      rule: SEC-06
      cwe: "CWE-20: Improper Input Validation"
    patterns:
      - pattern-either:
          - pattern: preg_match($PATTERN, $INPUT, ...)
          - pattern: preg_match($PATTERN, $INPUT)
      # A literal that ends with an unescaped `$` and a delimiter, flags without D or m (with m, `$` ends a line on purpose: a
      # multi-line parser).
      # metavariable-regex is anchored at the start of the text: hence `.*`.
      - metavariable-regex:
          metavariable: $PATTERN
          regex: ^["'](?P<d>[/#~@%!|])(?!.*\\z).*[^\\]\$(?P=d)[a-ln-zA-CE-Z]*["']$
      # A value that comes from the request, or is named like one.
      - metavariable-regex:
          metavariable: $INPUT
          regex: (?is).*(\$_(GET|POST|REQUEST|SERVER|COOKIE)\b|path|file|name|slug|uri|url|size|segment|request|param|query|filename|basename)

  - id: pollora.sec-06.secret-compared-without-hash-equals
    languages: [php]
    severity: ERROR
    message: >-
      [SEC-06] A signature, HMAC, token or secret is compared with an
      equality operator, which stops at the first different byte and leaks,
      through its timing, how much of the value a guess got right. Use
      hash_equals($known, $given), with the known value first.
    metadata:
      rule: SEC-06
      cwe: "CWE-208: Observable Timing Discrepancy"
    patterns:
      - pattern-either:
          - pattern: $S === $O
          - pattern: $S == $O
          - pattern: $S !== $O
          - pattern: $S != $O
          - pattern: $O === $S
          - pattern: $O == $S
          - pattern: $O !== $S
          - pattern: $O != $S
      # metavariable-regex is anchored at the start of the text: hence `.*`.
      # A bare `key` is left out: it names array and meta keys far more often
      # than secrets. A call that only measures the value does not compare it.
      - metavariable-regex:
          metavariable: $S
          regex: '(?is)\A(?!\s*(strlen|mb_strlen|count|sizeof|is_\w+|isset|empty)\s*\().*(signature|hmac|token|secret|api_?key|apikey|private_?key|secret_?key|license_?key)'
      # Comparing with a literal, null or a number is a presence check, not a
      # secret check.
      - metavariable-regex:
          metavariable: $O
          regex: '(?is)\A(?!(null|true|false|\[\s*\]|-?\d+(\.\d+)?|"[^"]*"|''[^'']*''|[A-Za-z_\\]+::[A-Z_]+)\z)'
