# Pollora harness — reusable workflow for a template: the skeleton, a theme, a plugin or a module.
#
# A template is copied into every project built from it, so it cannot carry the harness:
# no `pollora/harness` in its composer.json, no `.harness.json` or `AGENTS.md` at its root.
# This workflow checks it from the outside instead. It installs what it needs in the job,
# reads the presets from this repository, and the template only adds one file,
# `.github/workflows/harness.yml`, which the scaffolders already strip.
#
#   jobs:
#     harness:
#       uses: Pollora/harness/.github/workflows/template.yml@v0.1.10
#       with:
#         mode: enforce
#       permissions:
#         contents: read
#
# The gates are the ones that need nothing but the source: secrets in the history, the code
# style, the security patterns and the dependency audit. PHPStan, Rector, the dependency
# analysis, the tests matrix, the API contract and the downstream run need a package, and a
# template is not one: a template has its own tests (a sweep, a contract) in its own workflow.

name: Pollora harness (template)

on:
  workflow_call:
    inputs:
      mode:
        description: enforce blocks a merge on a failed gate; observe reports and never blocks
        type: string
        default: enforce
      observed:
        description: gates reported but never blocking even in enforce mode, among secrets, style, security and audit (space or comma separated)
        type: string
        default: ''
      php-version:
        description: PHP version of the jobs
        type: string
        default: '8.4'

permissions: {}

# A new push to a pull request cancels the run still going for the previous one. Every other event
# gets a group of its own (the run id): main, develop and tags are never cancelled or replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pollora-harness-template-{0}-{1}', github.repository, github.event.pull_request.number) || format('pollora-harness-template-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets (SEC-08)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'secrets') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'style') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # Pint is installed here, not required by the template. It reads the template's own
      # pint.json when it has one, and falls back to the Laravel preset.
      #
      # A template holds placeholders the scaffolder fills in (%theme_namespace%,
      # %plugin_name%). They are not PHP, so Pint fails to parse the file. It runs on a copy
      # where each placeholder is an identifier: __PLH_theme_namespace__.
      - name: Check the style with Pint
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          if [ -z "$(git ls-files '*.php')" ]; then
            echo "::notice::No PHP file to check."
            exit 0
          fi
          composer global require laravel/pint --no-interaction --no-progress
          pint="$(composer global config bin-dir --absolute)/pint"
          copy="$RUNNER_TEMP/template-style"
          mkdir -p "$copy"
          rsync -a --exclude .git ./ "$copy"/
          find "$copy" -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 sed -i -E 's/%([a-z][a-z0-9_]+)%/__PLH_\1__/g'
          cd "$copy"
          "$pint" --test

  security:
    name: Security patterns (SEC-01 to SEC-07, CONV-10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'security') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules come from the version of the harness this workflow was called at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/harness
          ref: ${{ github.job_workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - name: Install Semgrep
        run: pipx install semgrep==1.186.0

      - name: Scan the source
        run: |
          targets=""
          for dir in src app config resources routes; do
            [ -d "$dir" ] && targets="$targets $dir"
          done
          if [ -z "$targets" ]; then
            echo "::notice::No source directory to scan."
            exit 0
          fi
          # shellcheck disable=SC2086
          semgrep scan --metrics=off --disable-version-check --error --quiet \
            --config .harness-presets/presets/semgrep/common.yml $targets

  audit:
    name: Dependency audit (SEC-09)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'audit') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The audit logic lives in the harness (`pollora-qa composer-audit`), read from the version of
      # this workflow, like the npm audit below: it tries again when Packagist times out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/harness
          ref: ${{ github.job_workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # A vulnerability fails at once. A network failure of the advisory API is attempted again
      # (3 attempts, 5 s then 15 s apart); if it stays unreachable the job fails, saying so.
      - name: Audit the locked dependencies
        run: |
          if [ ! -f composer.lock ]; then
            echo "::notice::No composer.lock to audit."
            exit 0
          fi
          # --locked: nothing is installed here, the lock file is what ships
          php .harness-presets/bin/pollora-qa composer-audit --locked

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Observed for now: the gate reports the alerts Composer's audit cannot see
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The audit logic lives in the harness (`pollora-qa npm-audit`), read from the version of
      # this workflow: the same code `pollora-qa check` runs, not a second copy in shell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/harness
          ref: ${{ github.job_workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # A high or critical advisory blocks, unless `npm_audit.allow` (in `.github/harness.json`, or
      # `.harness.json`) names it, with a reason and an expiry at most 90 days away. An exception
      # that has expired fails the job. The tolerated advisories are listed in the job summary.
      - name: Audit the locked npm dependencies
        run: php .harness-presets/bin/pollora-qa npm-audit
