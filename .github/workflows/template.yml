# Pollora harness — reusable workflow for a template: the skeleton, a theme, a plugin or a module.
#
# A template is copied into every project built from it, so it cannot carry the harness:
# no `pollora/harness` in its composer.json, no `AGENTS.md` at its root.
# This workflow checks it from the outside instead. It installs what it needs in the job,
# reads the presets from this repository, and the template only adds one file,
# `.github/workflows/harness.yml`, which the scaffolders already strip.
#
# A template MAY also carry a `.harness.json` (or `.github/harness.json`, which the release
# archives leave out): the `ratchet` job then holds its type coverage floor (QA-01, CONV-11),
# and `npm_audit.allow` is read by the npm audit. A template without that file is checked
# exactly as before: the `ratchet` job finds nothing to read and passes at once.
#
#   jobs:
#     harness:
#       uses: Pollora/harness/.github/workflows/template.yml@v0.1.41
#       with:
#         mode: enforce
#       permissions:
#         contents: read
#
# The gates are the ones that need nothing but the source: secrets in the history, the code
# style, the security patterns and the dependency audit. PHPStan, Rector, the dependency
# analysis, the tests matrix, the API contract and the downstream run need a package, and a
# template is not one: a template has its own tests (a sweep, a contract) in its own workflow.

name: Pollora harness (template)

on:
  workflow_call:
    inputs:
      mode:
        description: enforce blocks a merge on a failed gate; observe reports and never blocks
        type: string
        default: enforce
      observed:
        description: gates reported but never blocking even in enforce mode, among secrets, style, security, audit and ratchet (space or comma separated)
        type: string
        default: ''
      php-version:
        description: PHP version of the jobs
        type: string
        default: '8.4'

permissions: {}

# A new push to a pull request cancels the run still going for the previous one. Every other event
# gets a group of its own (the run id): main, develop and tags are never cancelled or replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pollora-harness-template-{0}-{1}', github.repository, github.event.pull_request.number) || format('pollora-harness-template-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets (SEC-08)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'secrets') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'style') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # Pint is installed here, not required by the template. It reads the template's own
      # pint.json when it has one, and falls back to the Laravel preset.
      #
      # A template holds placeholders the scaffolder fills in (%theme_namespace%,
      # %plugin_name%). They are not PHP, so Pint fails to parse the file. It runs on a copy
      # where each placeholder is an identifier: __PLH_theme_namespace__.
      - name: Check the style with Pint
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          if [ -z "$(git ls-files '*.php')" ]; then
            echo "::notice::No PHP file to check."
            exit 0
          fi
          composer global require laravel/pint --no-interaction --no-progress
          pint="$(composer global config bin-dir --absolute)/pint"
          copy="$RUNNER_TEMP/template-style"
          mkdir -p "$copy"
          rsync -a --exclude .git ./ "$copy"/
          find "$copy" -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 sed -i -E 's/%([a-z][a-z0-9_]+)%/__PLH_\1__/g'
          cd "$copy"
          "$pint" --test

  security:
    name: Security patterns (SEC-01 to SEC-07, CONV-10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'security') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules come from the version of the harness this workflow was called at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/harness
          ref: ${{ job.workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - name: Install Semgrep
        run: pipx install semgrep==1.186.0

      - name: Scan the source
        run: |
          targets=""
          for dir in src app config resources routes; do
            [ -d "$dir" ] && targets="$targets $dir"
          done
          if [ -z "$targets" ]; then
            echo "::notice::No source directory to scan."
            exit 0
          fi
          # shellcheck disable=SC2086
          semgrep scan --metrics=off --disable-version-check --error --quiet \
            --config .harness-presets/presets/semgrep/common.yml $targets

  audit:
    name: Dependency audit (SEC-09)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'audit') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The audit logic lives in the harness (`pollora-qa composer-audit`), read from the version of
      # this workflow, like the npm audit below: it tries again when Packagist times out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/harness
          ref: ${{ job.workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # A vulnerability fails at once. A network failure of the advisory API is attempted again
      # (3 attempts, 5 s then 15 s apart); if it stays unreachable the job fails, saying so.
      - name: Audit the locked dependencies
        run: |
          if [ ! -f composer.lock ]; then
            echo "::notice::No composer.lock to audit."
            exit 0
          fi
          # --locked: nothing is installed here, the lock file is what ships
          php .harness-presets/bin/pollora-qa composer-audit --locked

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Observed for now: the gate reports the alerts Composer's audit cannot see
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The audit logic lives in the harness (`pollora-qa npm-audit`), read from the version of
      # this workflow: the same code `pollora-qa check` runs, not a second copy in shell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/harness
          ref: ${{ job.workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # A high or critical advisory blocks, unless `npm_audit.allow` (in `.github/harness.json`, or
      # `.harness.json`) names it, with a reason and an expiry at most 90 days away. An exception
      # that has expired fails the job. The tolerated advisories are listed in the job summary.
      - name: Audit the locked npm dependencies
        run: php .harness-presets/bin/pollora-qa npm-audit

  ratchet:
    name: Ratchet (QA-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'ratchet') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Optional: a template that never adopted the file has nothing to hold, and every step below is skipped.
      - name: Look for the template's harness file
        id: file
        run: |
          if [ -f .harness.json ] || [ -f .github/harness.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No .harness.json (or .github/harness.json): no ratchet floor to hold."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.file.outputs.present == 'true'
        with:
          repository: Pollora/harness
          ref: ${{ job.workflow_sha }}
          path: .harness-presets
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.file.outputs.present == 'true'
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      # The type coverage is read from the source by nikic/php-parser alone: no `composer install` of the
      # template (it may not install here) and none of the harness (Pint, PHPStan, Rector are not needed). The
      # parser comes from a scratch directory, at the version the harness requires, and the harness loads its
      # own classes next to it.
      - name: Install the source parser
        if: steps.file.outputs.present == 'true'
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          constraint="$(jq -r '.require["nikic/php-parser"]' .harness-presets/composer.json)"
          mkdir "$RUNNER_TEMP/parser"
          composer require --working-dir="$RUNNER_TEMP/parser" "nikic/php-parser:$constraint" --no-interaction --no-progress --no-scripts
          ln -s "$RUNNER_TEMP/parser/vendor" .harness-presets/vendor

      # The workflow's mode decides whether a drop blocks (enforce) or only reports (observe): the file's own
      # `mode` key is for packages and is ignored here. Without a recorded floor nothing is compared.
      - name: Hold the ratchet floors
        if: steps.file.outputs.present == 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          flag=--observe
          [ "$MODE" = "enforce" ] && flag=--enforce
          php .harness-presets/bin/pollora-qa check --template "$flag"

  # One check with a name that never changes (the names above carry the profile and the mode, or a PHP version), for a
  # repository to require in its branch protection. It fails when a needed job failed or was
  # cancelled, except a failure the job's own continue-on-error already ignores. A skipped job did not apply.
  # always() is required: GitHub counts a skipped required check as passed.
  result:
    name: Result
    needs: [secrets, style, security, audit, npm-audit, ratchet]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The same expressions as the continue-on-error of each job
          ADVISORY_SECRETS: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'secrets') }}
          ADVISORY_STYLE: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'style') }}
          ADVISORY_SECURITY: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'security') }}
          ADVISORY_AUDIT: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'audit') }}
          ADVISORY_NPM_AUDIT: true
          ADVISORY_RATCHET: ${{ inputs.mode != 'enforce' || contains(inputs.observed, 'ratchet') }}
        run: |
          set -euo pipefail
          results=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')
          if [ -z "$results" ]; then
            echo "::error::No job result to read."
            exit 1
          fi
          status=0
          while read -r job result; do
            # ADVISORY_<JOB> is "true" where the job has continue-on-error: its failure never blocked the run.
            advisory="ADVISORY_$(printf '%s' "$job" | tr 'a-z-' 'A-Z_')"
            verdict=blocking
            case "$result" in
              success) verdict=ok ;;
              # Skipped is how a job that does not apply ends; setup always applies.
              skipped) if [ "$job" != "setup" ]; then verdict=ok; fi ;;
              failure) if [ "${!advisory:-}" = "true" ]; then verdict="reported, not blocking"; fi ;;
            esac
            echo "$job: $result ($verdict)"
            if [ "$verdict" = "blocking" ]; then
              echo "::error::$job ended in $result."
              status=1
            fi
          done <<< "$results"
          exit "$status"
