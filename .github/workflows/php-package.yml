# Pollora harness — reusable workflow for every PHP repository.
#
# A repository calls it from .github/workflows/harness.yml (written by
# `pollora-qa init`). Profile, mode and downstream repositories come from the
# repository's .harness.json, so this file never needs a per-repository input.
#
#   jobs:
#     harness:
#       uses: Pollora/harness/.github/workflows/php-package.yml@main
#       permissions:
#         contents: read
#
# In observe mode every job reports and none fails the build; in enforce mode
# the quality, tests and secrets jobs block the merge (mark them required in
# the branch protection), and so does downstream for core packages.

name: Pollora harness

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON list of the PHP versions the tests run on
        type: string
        default: '["8.3", "8.4"]'
      quality-php:
        description: PHP version of the quality job
        type: string
        default: '8.4'
      framework-ref:
        description: Branch of Pollora/framework the downstream job runs
        type: string
        default: develop

permissions: {}

# A new push to a pull request cancels the run still going for the previous one. Every other event
# (main, develop, tags, manual runs) gets a group of its own (the run id): it is never cancelled or
# replaced. The group name is prefixed so that it cannot clash with a group of the calling workflow.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pollora-harness-php-package-{0}-{1}', github.repository, github.event.pull_request.number) || format('pollora-harness-php-package-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Read .harness.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.config.outputs.profile }}
      mode: ${{ steps.config.outputs.mode }}
      downstream: ${{ steps.config.outputs.downstream }}
      mutation: ${{ steps.config.outputs.mutation }}
      mutation-scope: ${{ steps.config.outputs.mutation-scope }}
      redis: ${{ steps.config.outputs.redis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: config
        name: Read profile, mode and downstream
        run: |
          if [ ! -f .harness.json ]; then
            echo "::error file=.harness.json::No .harness.json. Run vendor/bin/pollora-qa init --profile=<profile>."
            exit 1
          fi
          echo "profile=$(jq -r '.profile' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode // "observe"' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "downstream=$(jq -r '(.downstream // []) | join(",")' .harness.json)" >> "$GITHUB_OUTPUT"
          # A repository that recorded a mutation score (ratchet.msi) gets it checked; the others are untouched.
          # A repository that declares "mutation": {"scope": "changed"} (or "added") is checked too, on the files the pull request
          # touches only, against its "min": its whole run is too long for CI. Everything else keeps the rule above.
          # A repository whose tests need a service lists it under "services" (today: "redis").
          echo "redis=$(jq -r 'if ((.services // []) | index("redis")) != null then "true" else "false" end' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "mutation-scope=$(jq -r '.mutation.scope // "all"' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "mutation=$(jq -r 'if (.ratchet.msi // null) != null or ((.mutation.scope // "all") | IN("changed", "added")) then "true" else "false" end' .harness.json)" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gates (${{ needs.setup.outputs.profile }}, ${{ needs.setup.outputs.mode }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The mutation gate of the changed files compares HEAD with its first parent: on a pull request's merge commit
      # that is the target branch, so the checkout keeps two commits instead of one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.setup.outputs.mutation-scope != 'all' && 2 || 1 }}

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite${{ needs.setup.outputs.redis == 'true' && ', redis, igbinary' || '' }}
          coverage: pcov

      - name: Start Redis
        if: needs.setup.outputs.redis == 'true'
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "::error::Redis did not start."
          exit 1

      # Composer's download cache: a hit means no archive is fetched from GitHub. A pull request
      # only restores it; the cache is written by the runs that are not pull requests (see README).
      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-quality-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ inputs.quality-php }}-quality-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Save Composer's cache
        if: github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-quality-${{ hashFiles('**/composer.json', '**/composer.lock') }}

      - name: Install Semgrep
        run: pipx install semgrep==1.186.0

      - name: Run every gate
        # QA-04: the pull request's labels say which public surface changes it
        # declares: api-change (additions) or breaking (anything).
        env:
          HARNESS_SURFACE_ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') && 'all' || (contains(github.event.pull_request.labels.*.name, 'api-change') && 'additions' || 'none') }}
          MUTATION: ${{ needs.setup.outputs.mutation }}
        run: |
          flags=""
          if [ "$MUTATION" = "true" ]; then flags="--mutation"; fi
          vendor/bin/pollora-qa check --coverage=.harness/coverage.xml $flags

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-report
          path: .harness/
          include-hidden-files: true
          if-no-files-found: ignore

  tests:
    name: Tests PHP ${{ matrix.php }} (${{ matrix.stability }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        stability: [prefer-lowest, prefer-stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite${{ needs.setup.outputs.redis == 'true' && ', redis, igbinary' || '' }}
          coverage: none

      - name: Start Redis
        if: needs.setup.outputs.redis == 'true'
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "::error::Redis did not start."
          exit 1

      # prefer-lowest proves the lower bounds in composer.json are real.
      # Composer's download cache: a hit means no archive is fetched from GitHub. A pull request
      # only restores it; the cache is written by the runs that are not pull requests (see README).
      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.stability }}-

      - name: Install dependencies (${{ matrix.stability }})
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
          STABILITY: ${{ matrix.stability }}
        run: composer update "--$STABILITY" --prefer-dist --no-interaction --no-progress

      - name: Save Composer's cache
        if: github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json', '**/composer.lock') }}

      - name: Run the tests
        run: vendor/bin/pest

  contract:
    name: PHP API compatibility (QA-05)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A pull request labelled "breaking" is a major version: the check reports, it does not block.
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' || contains(github.event.pull_request.labels.*.name, 'breaking') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          coverage: none

      - name: Compare the PHP API with the latest release
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::notice::No release tag yet: nothing to compare the API with."
            exit 0
          fi
          composer global require roave/backward-compatibility-check --no-interaction --no-progress
          status=0
          "$(composer global config bin-dir --absolute)/roave-backward-compatibility-check" --from="$tag" --format=github-actions 2>&1 | tee /tmp/bc-check.log || status=$?
          # A class extending one that no autoloader maps (WP-CLI's WP_CLI_Command is loaded by its bootstrap) cannot be reflected: that is a limit of the tool, not a break
          if [ "$status" -ne 0 ] && grep -q 'could not be found in the located source' /tmp/bc-check.log; then
            echo "::warning::The API could not be compared: a parent class is not reachable by the autoloader. Check the public API by hand."
            exit 0
          fi
          exit "$status"

  secrets:
    name: Secrets (SEC-08)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  downstream:
    name: Downstream — framework with this change (QA-03)
    needs: setup
    if: contains(needs.setup.outputs.downstream, 'framework')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocks in enforce mode (QA-03); in observe mode it only reports what it would have caught.
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: package
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/framework
          ref: ${{ inputs.framework-ref }}
          path: framework
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      # The same technique as the framework's skeleton-install job: the
      # package is served from this checkout under a version the framework's
      # constraint accepts, the next patch of its latest tag.
      - name: Point the framework at this checkout
        id: alias
        run: |
          name=$(jq -r '.name' package/composer.json)
          tag=$(git -C package describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          version=$(echo "${tag#v}" | awk -F. '{ printf "%d.%d.999", $1, $2 }')
          constraint=$(jq -r --arg n "$name" '.require[$n] // empty' framework/composer.json)
          if [ -z "$constraint" ]; then
            echo "::notice::pollora/framework does not require $name: nothing to run downstream."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$name served as $version (latest tag $tag, framework requires $constraint)"
          cd framework
          composer config repositories.subject "{\"type\": \"path\", \"url\": \"../package\", \"options\": {\"symlink\": false, \"versions\": {\"$name\": \"$version\"}}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Locate Composer's cache
        id: composer-cache
        if: steps.alias.outputs.skip != 'true'
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        if: steps.alias.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-downstream-${{ hashFiles('framework/composer.json', 'framework/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ inputs.quality-php }}-downstream-

      - name: Install the framework with this change
        if: steps.alias.outputs.skip != 'true'
        working-directory: framework
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
          PACKAGE: ${{ steps.alias.outputs.name }}
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer update "$PACKAGE" --with-all-dependencies --no-interaction --no-progress

      - name: Save Composer's cache
        if: steps.alias.outputs.skip != 'true' && github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-downstream-${{ hashFiles('framework/composer.json', 'framework/composer.lock') }}

      - name: Run the framework's unit tests
        if: steps.alias.outputs.skip != 'true'
        working-directory: framework
        run: composer test:unit
