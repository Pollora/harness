# Pollora harness — reusable workflow for every PHP repository.
#
# A repository calls it from .github/workflows/harness.yml (written by
# `pollora-qa init`). Profile, mode and downstream repositories come from the
# repository's .harness.json, so this file never needs a per-repository input.
#
#   jobs:
#     harness:
#       uses: Pollora/harness/.github/workflows/php-package.yml@main
#       permissions:
#         contents: read
#
# In observe mode every job reports and none fails the build; in enforce mode
# the quality, tests and secrets jobs block the merge (mark them required in
# the branch protection), and so does downstream for core packages.

name: Pollora harness

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON list of the PHP versions the tests run on
        type: string
        default: '["8.3", "8.4"]'
      quality-php:
        description: PHP version of the quality job
        type: string
        default: '8.4'
      quality-timeout-minutes:
        description: >-
          Maximum duration of the Quality gates job, in minutes (30 by default; GitHub allows up to 360). A repository whose
          whole mutation pass lasts longer than 30 minutes on the runner raises it here, or limits the mutation to the files a
          pull request changes. The other jobs keep their own limits.
        type: number
        default: 30
      framework-ref:
        description: Branch of Pollora/framework the downstream job runs
        type: string
        default: develop
      mutation-on-pull-request:
        description: >-
          What the mutation gate mutates on a pull request when .harness.json sets no mutation.scope: `changed` (default)
          only the source files the pull request changes, `all` the whole repository as before. Other events always mutate
          everything. Ignored when the repository declares mutation.scope itself (a `changed-relative` one runs its gate on
          pull requests only).
        type: string
        default: changed
      wordpress-integration:
        description: >-
          Optional. Directory of the integration test suite (for example `tests/Integration`) that runs against a real
          WordPress and a real MySQL, in the `WordPress integration` job. Empty (default) disables the job: it is skipped.
          A `test:integration` script in composer.json takes precedence over the directory to start the suite.
        type: string
        default: ''
      wordpress-version:
        description: >-
          WordPress the integration job installs: `latest` (default, the latest stable release), `nightly` or a
          version number such as `6.9` or `6.9.1`. Ignored while wordpress-integration is empty.
        type: string
        default: latest
      wordpress-plugins:
        description: >-
          Comma-separated wordpress.org slugs the integration job installs and activates (for example `action-scheduler`).
          Empty (default): none. Ignored while wordpress-integration is empty.
        type: string
        default: ''

permissions: {}

# A new push to a pull request cancels the run still going for the previous one. Every other event
# (main, develop, tags, manual runs) gets a group of its own (the run id): it is never cancelled or
# replaced. The group name is prefixed so that it cannot clash with a group of the calling workflow.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pollora-harness-php-package-{0}-{1}', github.repository, github.event.pull_request.number) || format('pollora-harness-php-package-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Read .harness.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.config.outputs.profile }}
      mode: ${{ steps.config.outputs.mode }}
      downstream: ${{ steps.config.outputs.downstream }}
      mutation: ${{ steps.config.outputs.mutation }}
      mutation-scope: ${{ steps.config.outputs.mutation-scope }}
      msi: ${{ steps.config.outputs.msi }}
      redis: ${{ steps.config.outputs.redis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: config
        name: Read profile, mode and downstream
        run: |
          if [ ! -f .harness.json ]; then
            echo "::error file=.harness.json::No .harness.json. Run vendor/bin/pollora-qa init --profile=<profile>."
            exit 1
          fi
          echo "profile=$(jq -r '.profile' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode // "observe"' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "downstream=$(jq -r '(.downstream // []) | join(",")' .harness.json)" >> "$GITHUB_OUTPUT"
          # A repository that recorded a mutation score (ratchet.msi) gets it checked; the others are untouched.
          # A repository that declares "mutation": {"scope": "changed"} (or "added", or "changed-relative") is checked too, on the files the pull request
          # touches only, against its "min": its whole run is too long for CI. Everything else keeps the rule above.
          # "changed-relative" only means something on a pull request: `Run every gate` decides what the other events run, from
          # whether a ratchet.msi is recorded.
          # A repository whose tests need a service lists it under "services" (today: "redis").
          echo "redis=$(jq -r 'if ((.services // []) | index("redis")) != null then "true" else "false" end' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "mutation-scope=$(jq -r '.mutation.scope // "all"' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "msi=$(jq -r 'if (.ratchet.msi // null) != null then "true" else "false" end' .harness.json)" >> "$GITHUB_OUTPUT"
          echo "mutation=$(jq -r 'if (.ratchet.msi // null) != null or ((.mutation.scope // "all") | IN("changed", "added", "changed-relative")) then "true" else "false" end' .harness.json)" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gates (${{ needs.setup.outputs.profile }}, ${{ needs.setup.outputs.mode }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.quality-timeout-minutes }}
    permissions:
      contents: read
    steps:
      # The mutation gate of the changed files (a pull request mutates only what it changes, inputs.mutation-on-pull-request)
      # and the budgets of PERF-01 compare HEAD with its first parent: on a pull request's merge commit that is the target
      # branch, so the checkout keeps two commits instead of one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite${{ needs.setup.outputs.redis == 'true' && ', redis, igbinary' || '' }}
          coverage: pcov

      - name: Start Redis
        if: needs.setup.outputs.redis == 'true'
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "::error::Redis did not start."
          exit 1

      # Composer's download cache: a hit means no archive is fetched from GitHub. A pull request
      # only restores it; the cache is written by the runs that are not pull requests (see README).
      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-quality-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ inputs.quality-php }}-quality-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Save Composer's cache
        if: github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-quality-${{ hashFiles('**/composer.json', '**/composer.lock') }}

      - name: Install Semgrep
        run: pipx install semgrep==1.186.0

      - name: Run every gate
        # QA-04: the pull request's labels say which public surface changes it
        # declares: api-change (additions) or breaking (anything).
        env:
          HARNESS_SURFACE_ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') && 'all' || (contains(github.event.pull_request.labels.*.name, 'api-change') && 'additions' || 'none') }}
          MUTATION: ${{ needs.setup.outputs.mutation }}
          MUTATION_SCOPE: ${{ needs.setup.outputs.mutation-scope }}
          MUTATION_MSI: ${{ needs.setup.outputs.msi }}
          MUTATION_ON_PR: ${{ inputs.mutation-on-pull-request }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flags=""
          if [ "$MUTATION" = "true" ]; then
            flags="--mutation"
            case "$MUTATION_ON_PR" in
              changed|all) ;;
              *) echo "::error::mutation-on-pull-request is \"$MUTATION_ON_PR\": use \"changed\" or \"all\"."; exit 1 ;;
            esac
            # The relative gate compares the files of a change with their base: it runs on pull requests only. After a
            # merge (or at night) HEAD^1 can be a whole release away, beyond mutation.max_files. A recorded ratchet.msi
            # still has to be checked somewhere, so those events then mutate the whole repository. Both cases are said in
            # the log and in the job summary: the gate is absent from the report, which must not read as a success.
            if [ "$MUTATION_SCOPE" = "changed-relative" ] && [ "$EVENT_NAME" != "pull_request" ]; then
              message="Mutation testing (changed files, relative): not run on a $EVENT_NAME event, it runs on pull requests only."
              if [ "$MUTATION_MSI" = "true" ]; then
                flags="--mutation --mutation-scope=all"
                message="$message .harness.json records ratchet.msi, so this run mutates the whole repository instead and the Ratchet step compares the score with that floor."
              else
                flags=""
                message="$message Nothing was mutated and no file was compared with its base."
              fi
              echo "::notice title=Relative mutation gate not run::$message"
              printf '> %s\n\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            fi
            # On a pull request, mutate only what the pull request changes (the whole score is measured on the main branch).
            # A repository that declares mutation.scope keeps it. The base is the first parent of the merge commit the
            # checkout holds; a checkout that is not a merge commit (another ref) has no such base, and counting from
            # HEAD^1 would silently mutate only the last commit: the whole repository is mutated instead.
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$MUTATION_ON_PR" = "changed" ] && [ "$MUTATION_SCOPE" = "all" ]; then
              if git rev-parse --verify --quiet 'HEAD^2' > /dev/null && git rev-parse --verify --quiet 'HEAD^1' > /dev/null; then
                flags="$flags --mutation-scope=changed --mutation-base=HEAD^1"
              else
                echo "::warning::The checkout is not the pull request's merge commit: mutating the whole repository instead of the changed files."
              fi
            fi
          fi
          vendor/bin/pollora-qa check --coverage=.harness/coverage.xml $flags

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-report
          path: .harness/
          include-hidden-files: true
          if-no-files-found: ignore

  tests:
    name: Tests PHP ${{ matrix.php }} (${{ matrix.stability }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        stability: [prefer-lowest, prefer-stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite${{ needs.setup.outputs.redis == 'true' && ', redis, igbinary' || '' }}
          coverage: none

      - name: Start Redis
        if: needs.setup.outputs.redis == 'true'
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "::error::Redis did not start."
          exit 1

      # prefer-lowest proves the lower bounds in composer.json are real.
      # Composer's download cache: a hit means no archive is fetched from GitHub. A pull request
      # only restores it; the cache is written by the runs that are not pull requests (see README).
      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.stability }}-

      - name: Install dependencies (${{ matrix.stability }})
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
          STABILITY: ${{ matrix.stability }}
        run: composer update "--$STABILITY" --prefer-dist --no-interaction --no-progress

      - name: Save Composer's cache
        if: github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json', '**/composer.lock') }}

      - name: Run the tests
        run: vendor/bin/pest

  # Optional: runs the repository's integration suite against a real WordPress and a real MySQL, which Brain Monkey doubles
  # cannot reproduce. Skipped (nothing starts, no cost) while the `wordpress-integration` input is empty. No other job
  # depends on it: a skipped or failed run here changes no other job and no status the repository requires. MySQL is a
  # service container rather than SQLite: it is the database WordPress runs on, so a query the SQLite translation layer
  # would accept and MySQL refuse is caught, and nothing but the WordPress archive (cached) is downloaded.
  wordpress:
    name: WordPress integration PHP ${{ matrix.php }}
    needs: setup
    if: inputs.wordpress-integration != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysqli, gd, intl, exif
          tools: wp-cli
          coverage: none

      # The inputs come from the calling workflow: they are checked here, and reach the other steps through
      # $GITHUB_ENV, never through a ${{ }} written inside a script.
      - name: Check the inputs and resolve the WordPress version
        id: wp
        env:
          SUITE: ${{ inputs.wordpress-integration }}
          VERSION: ${{ inputs.wordpress-version }}
          PLUGINS: ${{ inputs.wordpress-plugins }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            *..*|/*|*[!A-Za-z0-9._/-]*) echo "::error::wordpress-integration is \"$SUITE\": give a directory of the repository, such as tests/Integration."; exit 1 ;;
          esac
          if [ ! -e "$SUITE" ] && ! jq -e '.scripts["test:integration"]' composer.json > /dev/null 2>&1; then
            echo "::error::wordpress-integration is \"$SUITE\", which does not exist, and composer.json has no test:integration script."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^(latest|nightly|[0-9]+\.[0-9]+(\.[0-9]+)?)$'; then
            echo "::error::wordpress-version is \"$VERSION\": use latest, nightly or a version such as 6.9 or 6.9.1."
            exit 1
          fi
          if [ -n "$PLUGINS" ] && ! printf '%s' "$PLUGINS" | grep -Eq '^[a-z0-9-]+(,[a-z0-9-]+)*$'; then
            echo "::error::wordpress-plugins is \"$PLUGINS\": give wordpress.org slugs separated by commas."
            exit 1
          fi
          resolved="$VERSION"
          if [ "$VERSION" = "latest" ]; then
            # The first offer of the update API is the latest stable release.
            resolved=$(curl --fail --silent --show-error --retry 3 --max-time 30 'https://api.wordpress.org/core/version-check/1.7/' | jq -r '.offers[0].version')
            if ! printf '%s' "$resolved" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "::error::Could not resolve the latest WordPress version (got \"$resolved\")."
              exit 1
            fi
          fi
          echo "WordPress $VERSION resolves to $resolved"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          # Comma-separated slugs cannot be part of a cache key: a short digest stands for them.
          echo "plugins=$(printf '%s' "$PLUGINS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          # A nightly changes every day: its archive is cached per day.
          if [ "$VERSION" = "nightly" ]; then echo "cache=nightly-$(date -u +%F)" >> "$GITHUB_OUTPUT"; else echo "cache=$resolved" >> "$GITHUB_OUTPUT"; fi

      # WP-CLI keeps the WordPress archive and the plugin archives here. A pull request only restores the cache;
      # the runs that are not pull requests write it (see README).
      - name: Restore the WordPress downloads
        id: wp-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.wp-cli/cache
          key: wp-cli-${{ runner.os }}-${{ steps.wp.outputs.cache }}-${{ steps.wp.outputs.plugins }}
          restore-keys: |
            wp-cli-${{ runner.os }}-${{ steps.wp.outputs.cache }}-

      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-wordpress-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-wordpress-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Save Composer's cache
        if: github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-wordpress-${{ hashFiles('**/composer.json', '**/composer.lock') }}

      # WordPress goes under RUNNER_TEMP, outside the repository: no Pint, PHPStan or Pest scan reads its files.
      - name: Install WordPress
        env:
          WP_VERSION: ${{ steps.wp.outputs.version }}
          PLUGINS: ${{ inputs.wordpress-plugins }}
          WP_VERSION_INPUT: ${{ inputs.wordpress-version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wordpress"
          version="$WP_VERSION"
          if [ "$WP_VERSION_INPUT" = "nightly" ]; then version="nightly"; fi
          wp core download --path="$dir" --version="$version" --force
          # MySQL is healthy before the steps start (service health check); the loop covers a slow first connection.
          for _ in $(seq 1 30); do
            if php -r 'exit(@mysqli_connect("127.0.0.1", "root", "root", "wordpress", 3306) ? 0 : 1);'; then break; fi
            sleep 2
          done
          wp config create --path="$dir" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --extra-php <<'PHP'
          defined('WP_DEBUG') || define('WP_DEBUG', true);
          defined('WP_DEBUG_LOG') || define('WP_DEBUG_LOG', true);
          defined('WP_DEBUG_DISPLAY') || define('WP_DEBUG_DISPLAY', false);
          defined('DISABLE_WP_CRON') || define('DISABLE_WP_CRON', true);
          PHP
          wp core install --path="$dir" --url=http://localhost --title=Integration --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          if [ -n "$PLUGINS" ]; then
            IFS=, read -ra slugs <<< "$PLUGINS"
            wp plugin install "${slugs[@]}" --activate --path="$dir"
          fi
          {
            echo "WP_PATH=$dir"
            echo "WP_CORE_DIR=$dir"
            echo "WP_TESTS_DB_HOST=127.0.0.1:3306"
            echo "WP_TESTS_DB_NAME=wordpress"
            echo "WP_TESTS_DB_USER=root"
            echo "WP_TESTS_DB_PASSWORD=root"
          } >> "$GITHUB_ENV"
          echo "Installed WordPress $(wp core version --path="$dir") on PHP $(php -r 'echo PHP_VERSION;')"

      - name: Save the WordPress downloads
        if: github.event_name != 'pull_request' && steps.wp-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.wp-cli/cache
          key: wp-cli-${{ runner.os }}-${{ steps.wp.outputs.cache }}-${{ steps.wp.outputs.plugins }}

      # The repository owns the command when it declares it. Otherwise the suite runs with phpunit.integration.xml, and
      # Pest is given the suite directory as its test directory: without it Pest loads tests/Pest.php and tests/Helpers
      # BEFORE the PHPUnit bootstrap, and the doubles of WordPress they declare (WP_Error, wp_parse_args...) collide with
      # the real WordPress that the bootstrap then loads ("Cannot redeclare class WP_Error"). With it, Pest looks for
      # Pest.php in the suite directory, which is the right place for what only the integration suite needs.
      - name: Run the integration tests
        env:
          SUITE: ${{ inputs.wordpress-integration }}
        run: |
          set -euo pipefail
          if jq -e '.scripts["test:integration"]' composer.json > /dev/null 2>&1; then
            composer run-script test:integration
          elif [ -f phpunit.integration.xml ]; then
            vendor/bin/pest --test-directory="$SUITE" -c phpunit.integration.xml
          else
            vendor/bin/pest "$SUITE"
          fi

  contract:
    name: PHP API compatibility (QA-05)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A pull request labelled "breaking" is a major version: the check reports, it does not block.
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' || contains(github.event.pull_request.labels.*.name, 'breaking') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          coverage: none

      - name: Compare the PHP API with the latest release
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::notice::No release tag yet: nothing to compare the API with."
            exit 0
          fi
          composer global require roave/backward-compatibility-check --no-interaction --no-progress
          status=0
          "$(composer global config bin-dir --absolute)/roave-backward-compatibility-check" --from="$tag" --format=github-actions 2>&1 | tee /tmp/bc-check.log || status=$?
          # A class extending one that no autoloader maps (WP-CLI's WP_CLI_Command is loaded by its bootstrap) cannot be reflected: that is a limit of the tool, not a break
          if [ "$status" -ne 0 ] && grep -q 'could not be found in the located source' /tmp/bc-check.log; then
            echo "::warning::The API could not be compared: a parent class is not reachable by the autoloader. Check the public API by hand."
            exit 0
          fi
          exit "$status"

  secrets:
    name: Secrets (SEC-08)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  downstream:
    name: Downstream — framework with this change (QA-03)
    needs: setup
    if: contains(needs.setup.outputs.downstream, 'framework')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocks in enforce mode (QA-03); in observe mode it only reports what it would have caught.
    continue-on-error: ${{ needs.setup.outputs.mode != 'enforce' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: package
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pollora/framework
          ref: ${{ inputs.framework-ref }}
          path: framework
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      # The same technique as the framework's skeleton-install job: the
      # package is served from this checkout under a version the framework's
      # constraint accepts, the next patch of its latest tag.
      - name: Point the framework at this checkout
        id: alias
        run: |
          name=$(jq -r '.name' package/composer.json)
          tag=$(git -C package describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          version=$(echo "${tag#v}" | awk -F. '{ printf "%d.%d.999", $1, $2 }')
          constraint=$(jq -r --arg n "$name" '.require[$n] // empty' framework/composer.json)
          if [ -z "$constraint" ]; then
            echo "::notice::pollora/framework does not require $name: nothing to run downstream."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$name served as $version (latest tag $tag, framework requires $constraint)"
          cd framework
          composer config repositories.subject "{\"type\": \"path\", \"url\": \"../package\", \"options\": {\"symlink\": false, \"versions\": {\"$name\": \"$version\"}}}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Locate Composer's cache
        id: composer-cache
        if: steps.alias.outputs.skip != 'true'
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer's cache
        id: composer-cache-restore
        if: steps.alias.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-downstream-${{ hashFiles('framework/composer.json', 'framework/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ inputs.quality-php }}-downstream-

      - name: Install the framework with this change
        if: steps.alias.outputs.skip != 'true'
        working-directory: framework
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
          PACKAGE: ${{ steps.alias.outputs.name }}
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer update "$PACKAGE" --with-all-dependencies --no-interaction --no-progress

      - name: Save Composer's cache
        if: steps.alias.outputs.skip != 'true' && github.event_name != 'pull_request' && steps.composer-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.quality-php }}-downstream-${{ hashFiles('framework/composer.json', 'framework/composer.lock') }}

      - name: Run the framework's unit tests
        if: steps.alias.outputs.skip != 'true'
        working-directory: framework
        run: composer test:unit
